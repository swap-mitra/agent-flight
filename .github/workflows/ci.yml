name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  # FR-R8: median interception overhead under 2 ms per call, on every path.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python benchmarks/overhead.py

  # The reference agent over Heptapod's tools (plan row 1.14). Heptapod needs
  # Python 3.12+ and its mock backends, which only a checkout has.
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # the replay report comment
    defaults:
      run:
        working-directory: dogfood
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: swap-mitra/heptapod
          ref: 1c22c23345ecda969a158f6e08d0487931b4ff62
          path: heptapod
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pyright
      - run: uv run pytest --fr-report=reports
        env:
          HEPTAPOD_DIR: ${{ github.workspace }}/heptapod
      # Plan row 2.9: the replayed regression test must catch a broken prompt.
      - name: A deliberately broken prompt fails the replay
        run: |
          sed -i 's/You operate business systems through tools./You operate systems./' reference_agent.py
          if uv run pytest tests/test_replay_suite.py -p no:cacheprovider; then
            echo "::error::the broken prompt was not caught"
            exit 1
          fi
          git checkout -- reference_agent.py
        env:
          HEPTAPOD_DIR: ${{ github.workspace }}/heptapod
      # Plan row 3.11: judge a cheaper routing policy by replay. The agent's
      # model is a scripted mock that answers any model the same way, so the
      # verdicts hold and the costs are its fixed token counts at each model's
      # price; the summary says so.
      - name: Evaluate a cheaper routing policy
        run: |
          uv run fr eval-route --policy policies/cheaper.toml --report reports -- tests/test_replay_suite.py -p no:cacheprovider
          grep -q '^| `test_demo_task` | 100% (1/1) |' reports/eval-route.md
          {
            cat reports/eval-route.md
            echo
            echo "_The reference agent's model is a scripted mock, so these numbers come from a mock: its fixed token counts priced at each model's rates._"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HEPTAPOD_DIR: ${{ github.workspace }}/heptapod
      # Plan row 4.12 (v0.4 exit criterion): one approved and one denied
      # irreversible call through the webhook, both in the audit export.
      - name: Approve and deny through the webhook
        run: |
          uv run pytest tests/test_gate_demo.py -p no:cacheprovider
          {
            echo "## Flight Recorder audit"
            echo
            echo '```csv'
            uv run fr audit
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HEPTAPOD_DIR: ${{ github.workspace }}/heptapod
          FR_DEMO_DIR: ${{ github.workspace }}/dogfood/demo-store
          FR_DIR: ${{ github.workspace }}/dogfood/demo-store
      - name: Post the replay report on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('dogfood/reports/report.md') != ''
        # A fork's token can't comment; the report is still in the job log.
        continue-on-error: true
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file reports/report.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}

  # Release exit criterion: the README quickstart works as written, from a
  # clean install of the built wheel. Its first python block is agent.py.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - run: uv build
      - run: |
          uv venv /tmp/qs
          uv pip install -p /tmp/qs dist/*.whl
          cd /tmp/qs
          awk '/^```python$/{f=1;next} /^```$/{if(f)exit} f' "$GITHUB_WORKSPACE/README.md" > agent.py
          export PATH=/tmp/qs/bin:$PATH
          id=$(python agent.py)
          fr runs | grep refund-desk
          fr show "$id"

  # A v* tag publishes to PyPI once every job above passes, by trusted
  # publishing, so no token is stored. --check-url skips files already
  # uploaded, so a rerun after a partial publish goes through.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, benchmark, dogfood, quickstart]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv build
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
