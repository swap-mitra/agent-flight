name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  # FR-R8: median interception overhead under 2 ms per call, on every path.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python benchmarks/overhead.py

  # The reference agent over Heptapod's tools (plan row 1.14). Heptapod needs
  # Python 3.12+ and its mock backends, which only a checkout has.
  dogfood:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dogfood
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: swap-mitra/heptapod
          ref: 1c22c23345ecda969a158f6e08d0487931b4ff62
          path: heptapod
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pyright
      - run: uv run pytest
        env:
          HEPTAPOD_DIR: ${{ github.workspace }}/heptapod

  # Release exit criterion: the README quickstart works as written, from a
  # clean install of the built wheel. Its first python block is agent.py.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - run: uv build
      - run: |
          uv venv /tmp/qs
          uv pip install -p /tmp/qs dist/*.whl
          cd /tmp/qs
          awk '/^```python$/{f=1;next} /^```$/{if(f)exit} f' "$GITHUB_WORKSPACE/README.md" > agent.py
          export PATH=/tmp/qs/bin:$PATH
          id=$(python agent.py)
          fr runs | grep refund-desk
          fr show "$id"
