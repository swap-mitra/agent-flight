[project]
name = "flight-recorder"
version = "0.1.0"
description = "Record, replay and gate AI agent runs: deterministic regression tests, run budgets and approval gates."
readme = "README.md"
authors = [
    { name = "swap-mitra", email = "swpnlmitra@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.scripts]
fr = "flight_recorder.cli:main"

[project.optional-dependencies]
openai = [
    "openai>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pyright",
    "openai>=1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
# ruff formats code blocks in markdown; the specs' aligned comments are deliberate.
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
