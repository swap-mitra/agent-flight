# Model prices in USD per million tokens, standard tier.
#
# Copied on 2026-11-03 from:
#   https://platform.claude.com/docs/en/about-claude/pricing
#   https://developers.openai.com/api/docs/pricing
# Prices change: override or extend this table with fr.configure(pricing=path),
# a file in this same format. Each entry in that file replaces the entry here.
#
# Keys are model ids as the provider returns them. A dated id such as
# claude-sonnet-4-5-20250929 or gpt-4o-2024-08-06 falls back to its undated key.
#
# Rates per million tokens: input (uncached prompt tokens), output,
# cache_read, cache_write (Anthropic 5-minute writes) and cache_write_1h.
# web_search is USD per 1,000 server-side searches. A call that used a rate
# its entry lacks records cost null. long_context holds the token rates for
# prompts over `above` tokens, cached tokens included.

