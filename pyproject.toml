[project]
name = "ai-flight-recorder"
version = "0.2.0"
description = "Record every model and tool call of an AI agent run, with tokens, cost and latency."
readme = "README.md"
authors = [
    { name = "swap-mitra", email = "swpnlmitra@gmail.com" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2"]

[project.urls]
Repository = "https://github.com/swap-mitra/ai-flight-recorder"
Changelog = "https://github.com/swap-mitra/ai-flight-recorder/blob/main/CHANGELOG.md"

[project.scripts]
fr = "flight_recorder.cli:main"

# pytest loads the plugin when the package is installed; it is inert
# for tests that don't use the fr_run fixture.
[project.entry-points.pytest11]
flight_recorder = "flight_recorder.pytest_plugin"

[project.optional-dependencies]
openai = [
    "openai>=1",
]
anthropic = [
    "anthropic>=0.40",
]
otel = [
    "opentelemetry-api>=1.27",
]
langchain = [
    "langchain-core>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pyright",
    "openai>=1",
    "anthropic>=0.40",
    "opentelemetry-sdk>=1.27",
    "langchain-core>=1",
    "langchain-openai>=1",
    "langchain-anthropic>=1",
    "langgraph>=1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is ai-flight-recorder; the import stays flight_recorder.
module-name = "flight_recorder"

[tool.ruff]
target-version = "py311"
# ruff formats code blocks in markdown; the specs' aligned comments are deliberate.
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
# dogfood/ is its own project with its own environment, checked by its own job.
exclude = ["dogfood", "**/.venv", "**/__pycache__"]
# The benchmark reuses the SDK contract tests' mock servers.
extraPaths = ["tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Interception must be invisible: a warning that reaches the agent is a bug.
filterwarnings = ["error"]
